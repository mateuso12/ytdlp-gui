[package]
name = "ytdlp-gui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ytdlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["process", "io-util", "macros", "rt", "time", "sync", "fs"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Pure-ring TLS backend: aws-lc-sys (reqwest's default provider) needs cmake/NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
which = "8.0.6"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tar = "0.4.46"
xz2 = "0.1.7"

# The updater plugin is desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
sysinfo = "0.39.6"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
